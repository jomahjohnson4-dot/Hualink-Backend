services:
  postgres:
    image: postgres:16-alpine
    container_name: hualink-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_password_123
      POSTGRES_DB: hualink_db
    ports:
      - "5433:5432"  # Host port 5433 maps to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hualink_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hualink-api
    restart: always
    ports:
      - "5000:5000"  # Host port 5000 maps to container port 5000
    environment:
      :5432/huaDATABASE_URL: "postgresql://postgres:production_password_123@postgres:5432/hualink_db?schema=public"
      JWT_SECRET: "your_super_secret_production_jwt_key_98765"
      PORT: 5000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: